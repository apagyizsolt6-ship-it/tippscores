name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # KIKÉNYSZERÍTJÜK A STABIL GRADLE 8.7 VERZIÓT
    - name: Setup Gradle Wrapper 8.7
      run: gradle wrapper --gradle-version 8.7

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # FONTOS: ./gradlew PARANCSOT HASZNÁLUNK A RENDSZER GRADLE HELYETT
    - name: Build APK with Gradle Wrapper
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TippScores-App-Debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
